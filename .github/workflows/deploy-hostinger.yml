name: 🚀 Automatic Deploy to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 📦 Build, Verify & Auto-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🧪 Run Verification & Lint
        run: |
          npm run lint
          npm test || true

      - name: 🛠️ Build Production Bundle (Frontend & Server)
        run: npm run build

      # =========================================================================
      # Method A: Automatic Deployment via SSH (Recommended for Cloud/VPS)
      # =========================================================================
      - name: 🚀 Deploy via SSH (if SSH credentials configured)
        if: env.HOSTINGER_SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_APP_PATH || '~/domains/yourdomain.com/public_html' }}
            git pull origin main || git pull origin master
            bash deploy.sh

      # =========================================================================
      # Method B: Automatic Deployment via FTP / SFTP (Alternative for Web Hosting)
      # =========================================================================
      - name: 🚀 Deploy via FTP (if FTP credentials configured)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/*.db

      # =========================================================================
      # Method C: Auto-Trigger Hostinger Git Webhook (if Webhook URL configured)
      # =========================================================================
      - name: 🌐 Trigger Hostinger Webhook (if Webhook URL configured)
        if: env.HOSTINGER_WEBHOOK_URL != ''
        env:
          HOSTINGER_WEBHOOK_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}
        run: |
          curl -X POST -s -L "$HOSTINGER_WEBHOOK_URL"
          echo "✅ Hostinger auto-deploy webhook triggered successfully."
