<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%" fill="none">
  <defs>
    <!-- Heavy Realistic 3D Ambient & Cast Drop Shadow -->
    <filter id="icon3DShadow" x="-20%" y="-20%" width="145%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="iconSteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#F1F5F9" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="90%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Cast Metal 3D Extrusion -->
    <linearGradient id="iconExtrusion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Deep Candy Glossy Red -->
    <linearGradient id="iconCandyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="25%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="90%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>
  </defs>

  <g filter="url(#icon3DShadow)" transform="translate(10, 8)">
    <!-- 3D Extrusion Shadow Base -->
    <g transform="translate(0, 5)" fill="url(#iconExtrusion)">
      <path d="M 170 85 L 250 89 L 170 95 Z" />
      <path d="M 140 180 L 250 180 L 235 188 L 145 188 Z" />
      <path d="M 152 60 C 112 32, 54 26, 18 64 C -6 96, -2 152, 22 196 C 54 240, 118 244, 154 206 L 136 190 C 110 216, 68 214, 42 180 C 24 150, 22 110, 40 86 C 68 56, 114 62, 138 84 Z" />
    </g>

    <!-- Top & Bottom Speed Fins -->
    <path d="M 170 85 L 250 89 L 170 95 Z" fill="url(#iconCandyRed)" stroke="#0F172A" stroke-width="1.8" />
    <path d="M 140 180 L 250 180 L 235 188 L 145 188 Z" fill="url(#iconCandyRed)" stroke="#0F172A" stroke-width="1.8" />

    <!-- Recessed Candy Red Arc -->
    <path d="M 170 85 C 130 55, 60 55, 30 100 C 10 130, 12 170, 36 200 C 65 235, 120 230, 150 180 L 130 174 C 110 205, 75 210, 52 186 C 36 166, 35 136, 50 114 C 74 80, 126 80, 152 102 Z"
          fill="url(#iconCandyRed)" stroke="#0F172A" stroke-width="2.2" />

    <!-- Brushed Steel Gear Body with Heavy 3D Cogs -->
    <g fill="url(#iconSteelGrad)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="160,35 190,52 180,74 152,60" />
      <polygon points="115,18 142,28 132,52 106,42" />
      <polygon points="68,14 92,20 86,46 62,42" />
      <polygon points="28,32 50,24 52,50 30,56" />
      <polygon points="4,70 24,54 34,78 12,92" />
      <polygon points="0,118 18,102 28,126 8,140" />
      <polygon points="4,166 18,144 38,160 26,182" />
      <polygon points="26,206 32,182 56,194 48,218" />
      <polygon points="68,236 62,210 88,214 84,240" />
      <polygon points="120,244 110,218 136,214 142,240" />

      <!-- Main Rim -->
      <path d="M 152 60 C 112 32, 54 26, 18 64 C -6 96, -2 152, 22 196 C 54 240, 118 244, 154 206 L 136 190 C 110 216, 68 214, 42 180 C 24 150, 22 110, 40 86 C 68 56, 114 62, 138 84 Z" />
    </g>

    <!-- 3D Spanner Bar across Center -->
    <g stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round">
      <path d="M 45 130 L 210 130 C 220 130, 230 124, 236 114 L 246 102 C 252 94, 264 98, 268 110 C 272 120, 268 132, 258 140 L 235 152 C 248 158, 258 168, 255 180 C 250 192, 236 196, 224 190 L 200 178 C 190 170, 180 162, 166 162 L 45 162 Z"
            fill="url(#iconSteelGrad)" />
      <!-- Jaw cutout -->
      <path d="M 262 112 L 232 130 C 224 136, 224 146, 232 152 L 254 166 C 260 170, 268 166, 268 158 C 268 150, 260 144, 250 140 C 244 138, 244 134, 250 132 C 260 128, 268 122, 266 114 Z"
            fill="url(#iconExtrusion)" />
    </g>

    <!-- 3D Metallic Red 'N' Emblem -->
    <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="46" stroke="#0F172A" stroke-width="5" stroke-linejoin="miter" paint-order="stroke fill" fill="url(#iconCandyRed)">
      <text x="74" y="157">N</text>
    </g>
    <!-- Top reflection -->
    <g font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="46" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8">
      <text x="74" y="156">N</text>
    </g>
  </g>
</svg>
