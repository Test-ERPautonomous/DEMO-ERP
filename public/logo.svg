<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Multi-Layer Realistic 3D Soft Contact Shadow -->
    <filter id="photoRealistic3DShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Brushed Steel Horizontal Surface Gradient -->
    <linearGradient id="brushedSteelSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="12%" stop-color="#F8FAFC" />
      <stop offset="28%" stop-color="#CBD5E1" />
      <stop offset="42%" stop-color="#FFFFFF" />
      <stop offset="58%" stop-color="#CBD5E1" />
      <stop offset="72%" stop-color="#94A3B8" />
      <stop offset="88%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Metallic Steel Vertical Light Flow -->
    <linearGradient id="steelVertLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="12%" stop-color="#F1F5F9" />
      <stop offset="38%" stop-color="#E2E8F0" />
      <stop offset="68%" stop-color="#CBD5E1" />
      <stop offset="90%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- 3D Cast Iron Extrusion Side Wall Gradient -->
    <linearGradient id="castExtrusionDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="35%" stop-color="#334155" />
      <stop offset="75%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glossy Automotive Candy Apple Red Enamel Gradient -->
    <linearGradient id="candyRedGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="16%" stop-color="#EF4444" />
      <stop offset="45%" stop-color="#DC2626" />
      <stop offset="75%" stop-color="#B91C1C" />
      <stop offset="92%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <!-- Red Speed Needle Horizontal Shimmer -->
    <linearGradient id="redNeedleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="20%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#EF4444" />
      <stop offset="85%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Inset Engraving Recessed Bed Shadow -->
    <filter id="engravingBedInset">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="2" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#000000" flood-opacity="0.65" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>

    <!-- Wrench Spanner Chrome Specular Reflection -->
    <radialGradient id="spannerGlint" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#E2E8F0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#photoRealistic3DShadow)">

    <!-- ===================================================================
         1. 3D CAST METAL EXTRUSION UNDERSTRUCTURE
         Creates the heavy 3D physical depth of the real metal emblem
         =================================================================== -->
    <g transform="translate(0, 8)" fill="url(#castExtrusionDark)">
      <!-- Gear Understructure -->
      <path d="M 435 112 C 380 68, 280 50, 190 78 C 110 102, 54 170, 62 242 C 68 274, 94 300, 126 310 C 182 328, 252 312, 308 270 L 340 248 C 300 282, 238 296, 192 280 C 158 268, 134 240, 128 212 C 120 156, 162 104, 230 84 C 300 64, 378 74, 424 110 Z" />

      <!-- Gear Teeth Understructure -->
      <polygon points="418,80 448,96 440,118 410,104" />
      <polygon points="352,48 384,62 374,86 344,74" />
      <polygon points="280,28 312,36 304,62 274,56" />
      <polygon points="204,22 238,24 234,50 202,50" />
      <polygon points="132,32 164,26 164,52 136,58" />
      <polygon points="76,62 104,46 112,72 88,88" />
      <polygon points="36,108 60,88 72,112 50,130" />
      <polygon points="18,162 36,140 54,160 38,184" />
      <polygon points="24,218 38,190 62,204 50,232" />
      <polygon points="56,268 64,238 90,250 82,278" />
      <polygon points="108,304 104,272 134,276 128,306" />
      <polygon points="176,318 166,286 196,280 204,312" />
      <polygon points="248,310 230,280 260,268 276,298" />
      <polygon points="320,280 298,252 328,236 348,264" />

      <!-- Horizontal Wrench & Open Spanner Head Understructure -->
      <path d="M 125 174 L 760 174 C 778 174, 795 162, 806 148 L 822 128 C 834 114, 856 120, 866 138 C 874 154, 868 174, 852 188 L 814 206 C 834 216, 852 232, 846 250 C 840 268, 818 276, 800 266 L 762 246 C 744 230, 728 218, 706 218 L 125 218 C 104 218, 96 194, 108 178 Z" />

      <!-- Speed Needles Understructure -->
      <path d="M 440 114 L 710 120 L 440 128 Z" />
      <path d="M 340 220 L 700 220 L 675 232 L 350 232 Z" />
    </g>


    <!-- ===================================================================
         2. INLAID GLOSSY CANDY RED ENAMEL (CHANNELS & SPEED ACCENTS)
         =================================================================== -->
    <!-- Top Speed Needle -->
    <path d="M 440 114 L 710 120 L 440 128 Z"
          fill="url(#redNeedleShimmer)"
          stroke="#0F172A"
          stroke-width="1.8" />
    <line x1="440" y1="115" x2="700" y2="120" stroke="#FFA4A4" stroke-width="1.2" opacity="0.85" />

    <!-- Bottom Speed Needle -->
    <path d="M 340 220 L 700 220 L 675 232 L 350 232 Z"
          fill="url(#redNeedleShimmer)"
          stroke="#0F172A"
          stroke-width="1.8" />
    <line x1="345" y1="221" x2="695" y2="221" stroke="#FFA4A4" stroke-width="1.2" opacity="0.85" />

    <!-- Deep Inlaid Red Curved Channel inside Gear -->
    <path d="M 440 112
             C 382 72, 286 56, 196 88
             C 126 114, 106 166, 122 216
             C 132 242, 160 264, 190 270
             C 240 282, 300 256, 344 218
             L 316 208
             C 280 240, 234 258, 192 248
             C 168 242, 148 226, 142 204
             C 128 162, 148 124, 206 104
             C 280 78, 362 90, 408 120
             Z"
          fill="url(#candyRedGloss)"
          stroke="#0F172A"
          stroke-width="2.5" />
    <!-- Specular Light Sheen inside Red Channel -->
    <path d="M 400 118 C 350 94, 276 86, 212 108 C 164 126, 144 158, 146 190"
          fill="none"
          stroke="#FFA4A4"
          stroke-width="1.6"
          opacity="0.9" />


    <!-- ===================================================================
         3. 3D BRUSHED STEEL GEAR RIM & COG TEETH
         =================================================================== -->
    <g fill="url(#steelVertLight)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="418,80 448,96 440,118 410,104" />
      <polygon points="352,48 384,62 374,86 344,74" />
      <polygon points="280,28 312,36 304,62 274,56" />
      <polygon points="204,22 238,24 234,50 202,50" />
      <polygon points="132,32 164,26 164,52 136,58" />
      <polygon points="76,62 104,46 112,72 88,88" />
      <polygon points="36,108 60,88 72,112 50,130" />
      <polygon points="18,162 36,140 54,160 38,184" />
      <polygon points="24,218 38,190 62,204 50,232" />
      <polygon points="56,268 64,238 90,250 82,278" />
      <polygon points="108,304 104,272 134,276 128,306" />
      <polygon points="176,318 166,286 196,280 204,312" />
      <polygon points="248,310 230,280 260,268 276,298" />
      <polygon points="320,280 298,252 328,236 348,264" />

      <!-- Main Heavy Steel Outer Rim -->
      <path d="M 410 104
               C 355 64, 268 48, 188 74
               C 112 98, 62 166, 68 240
               C 74 272, 100 298, 132 308
               C 188 324, 258 308, 314 266
               L 290 242
               C 246 274, 188 286, 144 270
               C 118 260, 98 238, 94 212
               C 86 156, 126 102, 192 84
               C 258 66, 332 76, 378 112
               Z" />
    </g>

    <!-- Top Metallic Highlights on Gear Teeth -->
    <path d="M 405 106 C 350 68, 266 52, 190 76 C 114 100, 66 168, 70 238"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          opacity="0.8" />


    <!-- ===================================================================
         4. 3D BRUSHED STEEL WRENCH & MECHANIC'S SPANNER HEAD
         =================================================================== -->
    <g stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round">
      <!-- Wrench Horizontal Body extending to Open Spanner Head -->
      <path d="M 125 174
               L 760 174
               C 778 174, 795 162, 806 148
               L 822 128
               C 834 114, 856 120, 866 138
               C 874 154, 868 174, 852 188
               L 814 206
               C 834 216, 852 232, 846 250
               C 840 268, 818 276, 800 266
               L 762 246
               C 744 230, 728 218, 706 218
               L 125 218
               C 104 218, 96 194, 108 178
               Z"
            fill="url(#brushedSteelSurface)" />

      <!-- Spanner Head 15-Degree Jaw Opening Cutout -->
      <path d="M 858 148
               L 808 176
               C 792 186, 792 204, 808 214
               L 842 236
               C 854 242, 866 234, 866 220
               C 866 206, 852 196, 836 190
               C 828 186, 828 180, 836 176
               C 854 170, 868 160, 866 150
               C 864 146, 860 146, 858 148
               Z"
            fill="url(#castExtrusionDark)" />
    </g>

    <!-- Chrome Specular Flare on Spanner Head -->
    <ellipse cx="810" cy="192" rx="32" ry="19" fill="url(#spannerGlint)" />

    <!-- Inset Engraved Recessed Metal Bed for "GARAGE & SCRAP" -->
    <path d="M 152 180
             L 746 180
             C 754 180, 760 186, 760 194
             C 760 202, 754 208, 746 208
             L 152 208
             C 144 208, 138 202, 138 194
             C 138 186, 144 180, 152 180
             Z"
          fill="#E2E8F0"
          stroke="#64748B"
          stroke-width="1.8"
          filter="url(#engravingBedInset)" />

    <!-- "GARAGE & SCRAP" - Laser-Etched Dark Gunmetal Typography -->
    <g fill="#0F172A" stroke="#0F172A" stroke-width="0.7">
      <text x="449" y="202"
            font-family="'Orbitron', 'Montserrat', 'Arial Black', sans-serif"
            font-weight="900"
            font-size="20"
            letter-spacing="9.5"
            text-anchor="middle">GARAGE &amp; SCRAP</text>
    </g>


    <!-- ===================================================================
         5. 3D EMBOSSED METALLIC RED LETTERS: "NAJM AL HUDA"
         =================================================================== -->
    <!-- Extruded Casting Shadow under Letters -->
    <g font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif"
       font-weight="900"
       font-size="58"
       letter-spacing="2.5"
       fill="#0F172A"
       transform="translate(2, 6)">
      <text x="180" y="165">NAJM AL HUDA</text>
    </g>

    <!-- Main Front Face of 3D Red Letters -->
    <g font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif"
       font-weight="900"
       font-size="58"
       letter-spacing="2.5"
       stroke="#0F172A"
       stroke-width="6.5"
       stroke-linejoin="miter"
       stroke-miterlimit="4"
       paint-order="stroke fill"
       fill="url(#candyRedGloss)">
      <text x="180" y="165">NAJM AL HUDA</text>
    </g>

    <!-- Top Bevel Chrome Edge Shimmer -->
    <g font-family="'Impact', 'Arial Black', 'Montserrat', sans-serif"
       font-weight="900"
       font-size="58"
       letter-spacing="2.5"
       fill="none"
       stroke="#FFFFFF"
       stroke-width="1.3"
       opacity="0.9"
       stroke-dasharray="14 8">
      <text x="180" y="164">NAJM AL HUDA</text>
    </g>

  </g>
</svg>
