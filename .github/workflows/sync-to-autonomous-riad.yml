
      - name: Push main to destination
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SYNC_TOKEN" ]; then
            echo "SYNC_TOKEN secret is missing or empty"
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' \
            "$SYNC_TOKEN" | base64 -w 0)"

          git \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            push \
            https://github.com/Autonomous-riad/Demo-ERP.git \
            HEAD:refs/heads/main
